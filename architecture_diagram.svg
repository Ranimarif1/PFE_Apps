<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="ah-gray"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6b7280"/></marker>
    <marker id="ah-blue"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#60a5fa"/></marker>
    <marker id="ah-green"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#34d399"/></marker>
    <marker id="ah-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#fb923c"/></marker>
    <marker id="ah-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#a78bfa"/></marker>
    <marker id="ah-cyan"   markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#22d3ee"/></marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="600" fill="#0d1117"/>
  <rect width="900" height="600" fill="url(#grid)" opacity="0.4"/>

  <!-- ══════════════════════════════════════════
       COUCHE PRÉSENTATION — SPA
       Boxes: y=27, h=90, bottom=117
  ══════════════════════════════════════════ -->
  <text x="30" y="20" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#475569" letter-spacing="3">COUCHE PRÉSENTATION — SPA</text>

  <!-- ── Desktop App ── x=20, y=27, w=440, h=90 -->
  <rect x="20" y="27" width="440" height="90" rx="14" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <line x1="40" y1="27" x2="443" y2="27" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
  <!-- monitor icon -->
  <rect x="38" y="45" width="64" height="44" rx="5" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="42" y="49" width="56" height="37" rx="3" fill="#0d1117"/>
  <rect x="46" y="53" width="32" height="4" rx="2" fill="#3b82f6" opacity="0.8"/>
  <line x1="46" y1="61" x2="94" y2="61" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <line x1="46" y1="66" x2="88" y2="66" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="71" x2="92" y2="71" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <line x1="46" y1="76" x2="85" y2="76" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>
  <rect x="62" y="89" width="8" height="8" fill="#1e40af"/>
  <rect x="54" y="97" width="24" height="4" rx="2" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
  <!-- titles -->
  <text x="116" y="44"  font-family="Arial,sans-serif" font-size="9"  font-weight="bold" fill="#60a5fa" letter-spacing="2">CLIENT DESKTOP</text>
  <text x="116" y="67"  font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="white">Desktop App</text>
  <text x="116" y="86"  font-family="Arial,sans-serif" font-size="10" fill="#93c5fd">React 18 · TypeScript · Vite · Tailwind CSS · shadcn/ui</text>

  <!-- ── QR Code Pairing bridge (gap x=460–590, h=90) ── -->
  <rect x="460" y="27" width="130" height="90" fill="#f59e0b" opacity="0.04"/>
  <line x1="461" y1="30" x2="461" y2="114" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,5" opacity="0.35"/>
  <line x1="589" y1="30" x2="589" y2="114" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,5" opacity="0.35"/>
  <!-- Pill label -->
  <rect x="464" y="32" width="112" height="16" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="43.5" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">QR CODE PAIRING</text>
  <!-- Badge ① -->
  <circle cx="520" cy="65" r="14" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="520" y="71" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fef3c7" text-anchor="middle">①</text>
  <!-- Arrow → Desktop shows QR to Mobile -->
  <text x="520" y="88" font-family="Arial,sans-serif" font-size="7" fill="#fbbf24" text-anchor="middle" font-style="italic">génère QR code</text>
  <line x1="463" y1="93" x2="586" y2="93" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,2.5" marker-end="url(#ah-orange)"/>
  <!-- Arrow ← Mobile scans -->
  <text x="520" y="106" font-family="Arial,sans-serif" font-size="7" fill="#fbbf24" text-anchor="middle" font-style="italic">scanne · rejoint session</text>
  <line x1="586" y1="111" x2="463" y2="111" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2.5" marker-end="url(#ah-orange)"/>

  <!-- ── Mobile SPA ── x=590, y=27, w=288, h=90 -->
  <rect x="590" y="27" width="288" height="90" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <line x1="610" y1="27" x2="861" y2="27" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <!-- phone icon -->
  <rect x="607" y="40" width="36" height="60" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <rect x="611" y="44" width="28" height="48" rx="3" fill="#0d1117"/>
  <circle cx="625" cy="86" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="625" cy="63"  r="7" fill="#059669" opacity="0.5"/>
  <rect x="621" y="56" width="8" height="12" rx="4" fill="#34d399"/>
  <path d="M 618 67 Q 618 75 625 75 Q 632 75 632 67" stroke="#34d399" stroke-width="1.5" fill="none"/>
  <!-- titles -->
  <text x="657" y="44"  font-family="Arial,sans-serif" font-size="9"  font-weight="bold" fill="#34d399" letter-spacing="2">CLIENT MOBILE</text>
  <text x="657" y="67"  font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="white">Mobile SPA</text>
  <text x="657" y="86"  font-family="Arial,sans-serif" font-size="10" fill="#6ee7b7">React / Vite · HTTPS · Audio dédié</text>

  <!-- ══════════════════════════════════════════
       ARROWS  Presentation → Node.js
  ══════════════════════════════════════════ -->
  <!-- Desktop ↓ straight down -->
  <line x1="240" y1="117" x2="240" y2="152" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ah-blue)"/>
  <!-- Mobile ↙ smooth bezier -->
  <path d="M 734 117 C 734 138 680 152 660 152" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,3" fill="none" marker-end="url(#ah-green)"/>
  <!-- Badge ② at bezier midpoint -->
  <circle cx="714" cy="133" r="13" fill="#0d1117" stroke="#34d399" stroke-width="1.5"/>
  <text x="714" y="138" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">②</text>
  <text x="732" y="138" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Flux audio</text>

  <!-- ══════════════════════════════════════════
       SERVICE TEMPS-RÉEL — Node.js
       y=154, h=76, bottom=230
  ══════════════════════════════════════════ -->
  <text x="30" y="150" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#475569" letter-spacing="3">SERVICE TEMPS-RÉEL</text>
  <rect x="115" y="154" width="650" height="76" rx="12" fill="#431407" stroke="#f97316" stroke-width="2"/>
  <line x1="135" y1="154" x2="748" y2="154" stroke="#fb923c" stroke-width="1" opacity="0.6"/>
  <!-- hex icon -->
  <polygon points="150,186 167,176 184,186 184,206 167,216 150,206" fill="#92400e" stroke="#f97316" stroke-width="1.5"/>
  <text x="167" y="200" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="white" text-anchor="middle">N</text>
  <!-- content -->
  <text x="202" y="174" font-family="Arial,sans-serif" font-size="9"  font-weight="bold" fill="#fb923c" letter-spacing="2">NODE.JS / SOCKET.IO</text>
  <text x="202" y="200" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="white">Serveur temps réel</text>
  <text x="202" y="218" font-family="Arial,sans-serif" font-size="10" fill="#fdba74">Faible latence · WebSocket · Appariement QR</text>

  <!-- ══════════════════════════════════════════
       ARROW — Django ↔ Desktop  (HTTP REST, far-left margin x=10–19)
  ══════════════════════════════════════════ -->
  <line x1="10" y1="119" x2="10" y2="257" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ah-purple)"/>
  <line x1="19" y1="257" x2="19" y2="119" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#ah-purple)"/>
  <!-- Label pill between the two section headers (y=150 and y=256) -->
  <rect x="23" y="193" width="76" height="16" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="61" y="204" font-family="Arial,sans-serif" font-size="7.5" font-weight="bold" fill="#a78bfa" text-anchor="middle">HTTP REST · JSON</text>

  <!-- ══════════════════════════════════════════
       ARROW ③  Node.js → Django
  ══════════════════════════════════════════ -->
  <line x1="440" y1="230" x2="440" y2="257" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ah-gray)"/>
  <circle cx="467" cy="244" r="13" fill="#0d1117" stroke="#6b7280" stroke-width="1.5"/>
  <text x="467" y="249" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#9ca3af" text-anchor="middle">③</text>
  <text x="485" y="249" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Transfert audio</text>

