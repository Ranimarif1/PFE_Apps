       API REST — Django
       y=260, h=100, bottom=360
  ══════════════════════════════════════════ -->
  <text x="30" y="256" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#475569" letter-spacing="3">API REST (BACKEND)</text>
  <rect x="20" y="260" width="855" height="100" rx="14" fill="#2e1065" stroke="#7c3aed" stroke-width="2"/>
  <line x1="40" y1="260" x2="858" y2="260" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
  <!-- django icon -->
  <rect x="42" y="278" width="56" height="56" rx="8" fill="#3b0764" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="70" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="middle">Dj</text>
  <!-- titles -->
  <text x="114" y="282" font-family="Arial,sans-serif" font-size="9"  font-weight="bold" fill="#a78bfa" letter-spacing="2">DJANGO REST FRAMEWORK</text>
  <text x="114" y="308" font-family="Arial,sans-serif" font-size="19" font-weight="900" fill="white">Django REST API</text>
  <text x="114" y="328" font-family="Arial,sans-serif" font-size="10.5" fill="#c4b5fd">HTTP REST · JSON · JWT · CORS · Gunicorn · PyMongo</text>

  <!-- ══════════════════════════════════════════
       ARROWS ④ ⑤  → Données & IA
  ══════════════════════════════════════════ -->
  <!-- ④ → MongoDB -->
  <line x1="207" y1="360" x2="207" y2="400" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ah-cyan)"/>
  <circle cx="234" cy="380" r="13" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="234" y="385" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#22d3ee" text-anchor="middle">④</text>
  <text x="252" y="385" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Persistance</text>
  <!-- ⑤ → AI -->
  <line x1="632" y1="360" x2="632" y2="400" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#ah-purple)"/>
  <circle cx="659" cy="380" r="13" fill="#0d1117" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="659" y="385" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle">⑤</text>
  <text x="677" y="385" font-family="Arial,sans-serif" font-size="9" fill="#6b7280">Pipeline IA</text>

  <!-- ══════════════════════════════════════════
       COUCHE DONNÉES & IA
       Wrapper: y=404, h=188, bottom=592
  ══════════════════════════════════════════ -->
  <text x="30" y="400" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#475569" letter-spacing="3">COUCHE DONNÉES &amp; IA</text>
  <rect x="20" y="404" width="855" height="188" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- ── MongoDB ── x=30, y=412, w=355, h=172, bottom=584 -->
  <rect x="30" y="412" width="355" height="172" rx="12" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="50" y1="412" x2="370" y2="412" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  <!-- cylinder icon -->
  <ellipse cx="74" cy="453" rx="24" ry="8" fill="#075985" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="50" y="453" width="48" height="40" fill="#075985"/>
  <ellipse cx="74" cy="493" rx="24" ry="8" fill="#075985" stroke="#0ea5e9" stroke-width="1.5"/>
  <ellipse cx="74" cy="473" rx="24" ry="8" fill="#0369a1" stroke="#0ea5e9" stroke-width="1"/>
  <path d="M 74 444 Q 85 456 74 476 Q 63 456 74 444 Z" fill="#00ed64" opacity="0.85"/>
  <!-- titles -->
  <text x="114" y="430" font-family="Arial,sans-serif" font-size="9"  font-weight="bold" fill="#38bdf8" letter-spacing="2">PERSISTANCE — NoSQL</text>
  <text x="114" y="457" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="white">MongoDB</text>
  <text x="114" y="475" font-family="Arial,sans-serif" font-size="9.5" fill="#7dd3fc">via pymongo · Schéma flexible · Semi-structuré</text>

  <!-- ── Couche IA ── x=402, y=412, w=461, h=172, bottom=584 -->
  <rect x="402" y="412" width="461" height="172" rx="12" fill="#14532d" stroke="#16a34a" stroke-width="2"/>
  <line x1="422" y1="412" x2="856" y2="412" stroke="#4ade80" stroke-width="1" opacity="0.6"/>
  <text x="422" y="430" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#4ade80" letter-spacing="2">PIPELINE IA — LOCAL · GPU CUDA</text>

  <!-- Whisper sub-box: x=414, y=436, w=210, h=132 -->
  <rect x="414" y="436" width="210" height="132" rx="10" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
  <!-- mic icon -->
  <rect x="511" y="449" width="14" height="20" rx="7" fill="#4ade80"/>
  <path d="M 504 463 Q 504 476 518 476 Q 532 476 532 463" stroke="#4ade80" stroke-width="2" fill="none"/>
  <line x1="518" y1="476" x2="518" y2="483" stroke="#4ade80" stroke-width="2"/>
  <text x="518" y="502" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle">Whisper</text>
  <text x="518" y="518" font-family="Arial,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">Fine-tuné · Français médical</text>
  <text x="518" y="533" font-family="Arial,sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">🇫🇷 Transcription FR médicale</text>
  <rect x="441" y="547" width="154" height="15" rx="7" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="518" y="558" font-family="Arial,sans-serif" font-size="8" fill="#4ade80" text-anchor="middle">GPU CUDA · Lazy-load · Fallback CPU</text>

  <!-- Ollama sub-box: x=642, y=436, w=210, h=132 -->
  <rect x="642" y="436" width="210" height="132" rx="10" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
  <!-- brain icon -->
  <ellipse cx="747" cy="460" rx="22" ry="15" fill="#4ade80" opacity="0.75"/>
  <path d="M 732 456 Q 729 464 735 468" stroke="#166534" stroke-width="2" fill="none"/>
  <path d="M 747 454 Q 747 464 747 468" stroke="#166534" stroke-width="2" fill="none"/>
  <path d="M 762 456 Q 765 464 759 468" stroke="#166534" stroke-width="2" fill="none"/>
  <text x="747" y="502" font-family="Arial,sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle">Ollama</text>
  <text x="747" y="518" font-family="Arial,sans-serif" font-size="9" fill="#86efac" text-anchor="middle">Mistral 7B · LLM local</text>
  <text x="747" y="533" font-family="Arial,sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">🏠 Correction médicale</text>
  <rect x="669" y="547" width="154" height="15" rx="7" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
  <text x="747" y="558" font-family="Arial,sans-serif" font-size="8" fill="#4ade80" text-anchor="middle">Terminologie radiologique · hors-ligne</text>
</svg>
